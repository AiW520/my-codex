name: Deploy download page

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "site/download/**"
      - "scripts/build-download-page.mjs"
      - "docs/image/readme/logo.png"
      - "docs/image/readme/home_zh.webp"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test download mapping
        run: node --test site/download/app.test.mjs

      - name: Build static download page
        run: node scripts/build-download-page.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/download-page

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
